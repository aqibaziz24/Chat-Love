<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat App</title>

    <!-- Appwrite Web SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-box {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message-box.sent {
            align-self: flex-end;
            background: #007bff;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .message-box.received {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }
        .sender-name {
            font-size: 0.75rem;
            margin-bottom: 3px;
            opacity: 0.8;
            font-weight: bold;
        }
        .chat-input-area {
            padding: 10px;
            background: #f8f9fa;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        #usernameInput {
            width: 30%;
        }
        #messageInput {
            flex: 1;
        }
        .chat-input-area button {
            padding: 10px 16px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Live Chat App</div>
        <div class="chat-messages" id="chatContainer"></div>
        
        <div class="chat-input-area">
            <input type="text" id="usernameInput" placeholder="Aapka Naam" value="User">
            <input type="text" id="messageInput" placeholder="Message likhein..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Appwrite Configuration Settings
        const APPWRITE_ENDPOINT = 'https://fra.cloud.appwrite.io/v1';
        const APPWRITE_PROJECT_ID = '6aa94a47002c3014b299';
        const APPWRITE_DATABASE_ID = '6ab006de001d6d900b7e';
        const APPWRITE_COLLECTION_ID = 'YOUR_MESSAGES_COLLECTION_ID'; // <-- Appwrite se Collection ID copy kar k yahan daalein

        // Appwrite SDK Init
        const { Client, Databases, ID, Query } = Appwrite;
        const client = new Client()
            .setEndpoint(APPWRITE_ENDPOINT)
            .setProject(APPWRITE_PROJECT_ID);

        const databases = new Databases(client);

        // Load Initial Messages & Cleanup Extra Records
        async function loadMessages() {
            try {
                // Fetch last 25 messages ordered by creation time
                const response = await databases.listDocuments(
                    APPWRITE_DATABASE_ID,
                    APPWRITE_COLLECTION_ID,
                    [
                        Query.orderAsc('$createdAt'),
                        Query.limit(25)
                    ]
                );

                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML = '';
                
                response.documents.forEach(doc => {
                    renderMessage(doc);
                });

                scrollToBottom();
                
                // Cleanup old messages if total count exceeds 25
                cleanupOldMessages();
            } catch (error) {
                console.error("Messages load karne me error:", error);
            }
        }

        // Send New Message
        async function sendMessage() {
            const username = document.getElementById('usernameInput').value.trim() || 'Anonymous';
            const messageText = document.getElementById('messageInput').value.trim();

            if (!messageText) return;

            document.getElementById('messageInput').value = '';

            try {
                await databases.createDocument(
                    APPWRITE_DATABASE_ID,
                    APPWRITE_COLLECTION_ID,
                    ID.unique(),
                    {
                        sender: username,
                        text: messageText
                    }
                );
                
                // Auto cleanup check after creating a new document
                cleanupOldMessages();
            } catch (error) {
                console.error("Message send karne me error:", error);
            }
        }

        // Render Message on UI
        function renderMessage(doc) {
            const chatContainer = document.getElementById('chatContainer');
            const currentUser = document.getElementById('usernameInput').value.trim() || 'Anonymous';
            
            const isSentByMe = doc.sender === currentUser;
            const msgElement = document.createElement('div');
            msgElement.classList.add('message-box', isSentByMe ? 'sent' : 'received');
            msgElement.setAttribute('id', `msg-${doc.$id}`);

            msgElement.innerHTML = `
                <div class="sender-name">${escapeHTML(doc.sender)}</div>
                <div>${escapeHTML(doc.text)}</div>
            `;

            chatContainer.appendChild(msgElement);
            scrollToBottom();
        }

        // Auto Delete Messages keep only last 25
        async function cleanupOldMessages() {
            try {
                // Fetch all documents ordered newest to oldest
                const response = await databases.listDocuments(
                    APPWRITE_DATABASE_ID,
                    APPWRITE_COLLECTION_ID,
                    [
                        Query.orderDesc('$createdAt')
                    ]
                );

                // If documents count is greater than 25, delete the oldest ones
                if (response.documents.length > 25) {
                    const extraDocs = response.documents.slice(25);
                    
                    for (const doc of extraDocs) {
                        await databases.deleteDocument(
                            APPWRITE_DATABASE_ID,
                            APPWRITE_COLLECTION_ID,
                            doc.$id
                        );
                        
                        // Remove from DOM if present
                        const elem = document.getElementById(`msg-${doc.$id}`);
                        if (elem) elem.remove();
                    }
                }
            } catch (error) {
                console.error("Cleanup error:", error);
            }
        }

        // Appwrite Realtime WebSocket Subscription
        function subscribeToRealtime() {
            const channel = `databases.${APPWRITE_DATABASE_ID}.collections.${APPWRITE_COLLECTION_ID}.documents`;

            client.subscribe(channel, response => {
                const event = response.events[0];
                const payload = response.payload;

                // Event check for new message created
                if (event.endsWith('.create')) {
                    const existingMsg = document.getElementById(`msg-${payload.$id}`);
                    if (!existingMsg) {
                        renderMessage(payload);
                    }
                }
                
                // Event check for message deletion
                if (event.endsWith('.delete')) {
                    const elem = document.getElementById(`msg-${payload.$id}`);
                    if (elem) elem.remove();
                }
            });
        }

        // Utility Helpers
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initialization
        window.onload = () => {
            loadMessages();
            subscribeToRealtime();
        };
    </script>
</body>
</html>
